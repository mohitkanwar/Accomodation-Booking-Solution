name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java for PlantUML
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Graphviz for PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          /usr/bin/dot -V

      - name: Cache PlantUML
        uses: actions/cache@v4
        with:
          path: .cache/plantuml
          key: plantuml-1.2026.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set build metadata
        run: |
          echo "DOCS_VERSION=$(node scripts/calculate-version.mjs)" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build Docusaurus
        run: pnpm build
        env:
          GRAPHVIZ_DOT: /usr/bin/dot

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
